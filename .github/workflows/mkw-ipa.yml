# The Mac part of a Mario Kart World (Switch 2) build on Switch 2 work for nxnative: runs on a push to the mkw-ipa branch, after the PC attached its input encrypted (release
# mkw-ipa-kit, AES-256-GCM with the KIT_PASSWORD secret, as nxkit's build kits, in parts under the 2 GB asset limit; deleted as soon as it is downloaded): the nxnative change as a
# patch and an nxkit build kit (rewritten code, game profile, shader package, no game files). nxnative is checked out at the commit the change is made against, the change applied,
# then nxkit.py build runs as in build-ipa.yml (nxkit's own patches, the shader build, build_ipa.sh). Output: the encrypted slim IPA as the artifact "ipa" (the PC merges it with the
# game files and deletes the artifact), or the encrypted build logs as "logs".
name: MKW IPA
run-name: mkw ipa ${{ github.sha }}

on:
  push:
    branches: [mkw-ipa]

permissions:
  contents: write   # deletes the input's release

defaults:
  run:
    shell: bash

env:
  NXNATIVE_REF: 2db12f7efdf2acf50026ec10f515193d67f2a3b6

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Get nxkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nxkit
          persist-credentials: false

      - name: Get nxnative
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: ${{ env.NXNATIVE_REF }}
          path: nxnative
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # .NET with DOTNET_ROOT set: the shader translator (dmsh_xlate_bin/dmsh_xlate) finds its runtime through it
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Install the build tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          python -m pip install -q lz4 capstone fonttools cryptography
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version

      - name: Download the input and delete its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          gh release download mkw-ipa-kit --pattern 'ipa-kit.nxk.*' --dir "$RUNNER_TEMP/in"
          gh release delete mkw-ipa-kit --yes --cleanup-tag

      - name: Decrypt the input and apply the change
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then echo "::error::The KIT_PASSWORD secret is missing"; exit 1; fi
          cat $(ls "$RUNNER_TEMP"/in/ipa-kit.nxk.* | sort) > "$RUNNER_TEMP/kit.nxk"; rm -rf "$RUNNER_TEMP/in"
          python nxkit/nxkit.py decrypt "$RUNNER_TEMP/kit.nxk" "$RUNNER_TEMP/kit.tar"; rm "$RUNNER_TEMP/kit.nxk"
          mkdir -p "$RUNNER_TEMP/in"; tar -xf "$RUNNER_TEMP/kit.tar" -C "$RUNNER_TEMP/in"; rm "$RUNNER_TEMP/kit.tar"
          git -C nxnative apply --whitespace=nowarn "$RUNNER_TEMP/in/change.patch"
          chmod +x nxnative/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
          sha=$(nxnative/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha) || { echo "::error::the shader translator does not start"; exit 1; }
          echo "shader translator source $sha"; cat "$RUNNER_TEMP/in/kit/meta.json"; df -h "$RUNNER_TEMP" | tail -1

      - name: Build the slim IPA
        run: |
          rc=0; python nxkit/nxkit.py build nxnative "$RUNNER_TEMP/in/kit" -o "$RUNNER_TEMP/slim.ipa" < /dev/null || rc=$?
          L="$RUNNER_TEMP/in/kit/work/logs"
          grep -E "^shaders |^note:|^library stamp" "$L/dmsh_build.log" 2>/dev/null | cut -c1-300 || true
          grep -E "entitlements|launcher:|RomFS overlay|app icon|done:" "$L/build_ipa.log" 2>/dev/null | cut -c1-300 || true
          exit $rc

      - name: Encrypt the IPA
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python nxkit/nxkit.py encrypt "$RUNNER_TEMP/slim.ipa" "$RUNNER_TEMP/out/slim.ipa.nxk"
          ls -lh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipa
          path: ${{ runner.temp }}/out/slim.ipa.nxk
          compression-level: 0
          retention-days: 1

      - name: Encrypt the build logs
        if: failure()
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -d "$RUNNER_TEMP/in/kit/work/logs" ]; then
            mkdir -p "$RUNNER_TEMP/out"
            tar -czf "$RUNNER_TEMP/logs.tgz" -C "$RUNNER_TEMP/in/kit/work" logs
            python nxkit/nxkit.py encrypt "$RUNNER_TEMP/logs.tgz" "$RUNNER_TEMP/out/logs.tgz.nxk"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: ${{ runner.temp }}/out/logs.tgz.nxk
          if-no-files-found: ignore
          retention-days: 1

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/in" "$RUNNER_TEMP/kit.nxk" "$RUNNER_TEMP/kit.tar" "$RUNNER_TEMP/slim.ipa" "$RUNNER_TEMP/out" "$RUNNER_TEMP/logs.tgz" nxnative; true
