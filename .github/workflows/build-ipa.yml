# The Mac part of an nxkit build (see README.md): started by `nxkit.py game` on the PC, never by hand.
# Input: an encrypted build kit the PC attached to a release of this repository (no game files: the rewritten code, the shader inputs, the icon).
# Output: the encrypted "slim" IPA (the app and its shader libraries, no game files) as the artifact "ipa", which the PC downloads and merges with the game files.
# Nothing readable is published: the kit and the IPA are AES-256-GCM encrypted with the KIT_PASSWORD secret, the kit's release is deleted as soon as it is downloaded
# and the artifact expires after a day (the PC deletes it as soon as it has it).
name: Build IPA
run-name: build ${{ inputs.kit_tag }}

on:
  workflow_dispatch:
    inputs:
      kit_tag:
        description: 'Release tag of the encrypted build kit (nxkit.py sets it)'
        required: true
      nxnative_ref:
        description: 'nxnative commit the kit was prepared with'
        required: true

permissions:
  contents: write   # deletes the kit's release
  actions: write    # deletes the game's older build caches

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26   # the runner nxnative's own CI builds its iOS app on
    timeout-minutes: 240
    steps:
      - name: Get nxkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nxkit
          persist-credentials: false

      - name: Get nxnative at the kit's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: ${{ inputs.nxnative_ref }}
          path: nxnative
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # .NET 10 with DOTNET_ROOT set: nxnative's shader translator (dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate, a .NET app host) finds its runtime only through it.
      # Pinned: on 2026-10-25 Microsoft listed SDK 10.0.403 before its files were online, and '10.0.x' then failed to install
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Install the build tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          python -m pip install -q lz4 capstone fonttools cryptography
          # Xcode 26 and later install the Metal compiler separately
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          # The translator must start (an NVN game's shaders go through it): its source fingerprint, or why it does not run
          sha=$(nxnative/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha) || { echo "::error::nxnative's shader translator does not start"; nxnative/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha; exit 1; }
          echo "shader translator source $sha"

      - name: Download the build kit and delete its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.kit_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          gh release download "$TAG" --pattern '*.nxk' --dir "$RUNNER_TEMP/kit"
          gh release delete "$TAG" --yes --cleanup-tag

      - name: Decrypt the build kit
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then echo "::error::The KIT_PASSWORD secret is missing: run nxkit.py setup on the PC"; exit 1; fi
          python nxkit/nxkit.py decrypt "$RUNNER_TEMP"/kit/*.nxk "$RUNNER_TEMP/kit.zip"
          rm -rf "$RUNNER_TEMP/kit"
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
          rm "$RUNNER_TEMP/kit.zip"

      # The build cache, per game (its title ID): nxnative's shader cache (kit/work/shader/cache/cas: translated shaders and compiled Metal libraries, looked up by
      # content, so a restored one never changes an output, it only skips rebuilding) and the game's own prebuilt libraries (patches/<id>/mac_build.sh: NXKIT_CACHE).
      # The shader cache is made from the game's files: it is stored encrypted with KIT_PASSWORD (a public repository's caches can be restored by pull requests)
      - name: The kit's game
        id: game
        run: echo "id=$(python -c "import json; print(json.load(open('$RUNNER_TEMP/kit/meta.json'))['game'])")" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nxcache
          key: nxcache-${{ steps.game.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nxcache-${{ steps.game.outputs.id }}-

      - name: Unpack the shader cache
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/nxcache" "$RUNNER_TEMP/kit/work/shader/cache"
          if [ -f "$RUNNER_TEMP/nxcache/shader-cas.tar.zst.nxk" ]; then
            python nxkit/nxkit.py decrypt "$RUNNER_TEMP/nxcache/shader-cas.tar.zst.nxk" "$RUNNER_TEMP/shader-cas.tar.zst"
            zstd -dcq "$RUNNER_TEMP/shader-cas.tar.zst" | tar -C "$RUNNER_TEMP/kit/work/shader/cache" -xf -
            rm "$RUNNER_TEMP/shader-cas.tar.zst"
            echo "shader cache: $(du -sh "$RUNNER_TEMP/kit/work/shader/cache/cas" | cut -f1) restored"
          else
            echo "no shader cache for this game yet: every shader is built"
          fi
          ls -l "$RUNNER_TEMP/nxcache"

      - name: Build the slim IPA
        env:
          NXKIT_CACHE: ${{ runner.temp }}/nxcache
        run: python nxkit/nxkit.py build nxnative "$RUNNER_TEMP/kit" -o "$RUNNER_TEMP/slim.ipa" < /dev/null

      - name: Encrypt the IPA
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python nxkit/nxkit.py encrypt "$RUNNER_TEMP/slim.ipa" "$RUNNER_TEMP/out/slim.ipa.nxk"
          ls -lh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipa
          path: ${{ runner.temp }}/out/slim.ipa.nxk
          compression-level: 0
          retention-days: 1

      - name: Pack the shader cache
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          CAS="$RUNNER_TEMP/kit/work/shader/cache/cas"
          if [ -d "$CAS" ]; then
            rm -f "$RUNNER_TEMP/nxcache/shader-cas.tar.zst.nxk"
            tar -C "$(dirname "$CAS")" -cf - cas | zstd -3 -T0 -q -o "$RUNNER_TEMP/shader-cas.tar.zst"
            python nxkit/nxkit.py encrypt "$RUNNER_TEMP/shader-cas.tar.zst" "$RUNNER_TEMP/nxcache/shader-cas.tar.zst.nxk"
            rm "$RUNNER_TEMP/shader-cas.tar.zst"
          fi
          ls -lh "$RUNNER_TEMP/nxcache"

      - name: Save the build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nxcache
          key: nxcache-${{ steps.game.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the game's older build caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: nxcache-${{ steps.game.outputs.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          PREFIX: nxcache-${{ steps.game.outputs.id }}-
        run: |
          gh cache list --key "$PREFIX" --limit 100 --json id,key --jq ".[] | select(.key != \"$KEEP\") | .id" | while read -r id; do gh cache delete "$id" || true; done

      - name: Encrypt the build logs
        if: failure()
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -d "$RUNNER_TEMP/kit/work/logs" ]; then
            mkdir -p "$RUNNER_TEMP/out"
            tar -czf "$RUNNER_TEMP/logs.tgz" -C "$RUNNER_TEMP/kit/work" logs
            python nxkit/nxkit.py encrypt "$RUNNER_TEMP/logs.tgz" "$RUNNER_TEMP/out/logs.tgz.nxk"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: ${{ runner.temp }}/out/logs.tgz.nxk
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/kit" "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/slim.ipa" "$RUNNER_TEMP/logs.tgz" "$RUNNER_TEMP/nxcache" "$RUNNER_TEMP/shader-cas.tar.zst"
