# The Mac part of a Mario Kart World build with Plumber Racer 2 (cheemu21/plumber-racer-2, nxnative with Mario Kart World on the iPhone): runs on a push to the pr2-ipa branch, after the
# PC attached its input encrypted (release pr2-ipa-kit, AES-256-GCM with the KIT_PASSWORD secret, as nxkit's build kits, in parts under the 2 GB asset limit; deleted as soon as it is
# downloaded): the dump's ExeFS and the RomFS folders the build reads (Shader, Lib, Effect, Layout, UI, System). Plumber Racer 2 is checked
# out at PR2_REF with nxkit's display options (pr2/display-options.patch: launcher Resolution and Screen Scaling) and memory parts (pr2/mem-anon.patch: with mem_file, the alias
# region, the stacks and the first 512 MB of the heap stay anonymous memory, DM_MEM_ANON; a "[mem] watch" log line every 10 s), texture cap (pr2/tex-cap.patch: soft textures' longest side at most
# 512, DM_NVN_TEX_CAP, and the dropped levels' pages go back from the file) and a fixed 30 fps (pr2/fps30.patch), with the diagnostic switches of pr2/env.txt, then its NSP script builds the IPA without the game files
# (--romfs separate). Output, encrypted: the slim IPA as the artifact "ipa" (the PC puts it into the whole IPA and deletes the artifacts), the shader cache as the kept release pr2-shaders-<PR2_REF>, or the
# build logs as "logs".
name: PR2 IPA
run-name: pr2 ipa ${{ github.sha }}

on:
  push:
    branches: [pr2-ipa]

permissions:
  contents: write   # deletes the input's release

defaults:
  run:
    shell: bash

env:
  PR2_REF: 843170ac3e7068d0a096acc9694aea478cc8873b
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer   # the toolchain Plumber Racer 2 supports (its tests.yml: Xcode 27.2 on the xcode-27 image)

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 330
    steps:
      - name: Get nxkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nxkit
          persist-credentials: false

      - name: Get Plumber Racer 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cheemu21/plumber-racer-2
          ref: ${{ env.PR2_REF }}
          path: pr2
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # dm/gfx/tools/dmsh_xlate_bin targets net10.0

      - name: Install the build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          xcodebuild -downloadComponent MetalToolchain   # a separate component, not included in the xcode-27 image
          brew install xcodegen zstd glslang
          python -m pip install -q lz4 "capstone>=5,<6" fonttools nsz zbic cryptography
          xcodebuild -version; xcrun metal --version
          python3 pr2/dm/gfx/tools/own_compilers.py --check-metal

      - name: Apply nxkit's display options and memory parts
        run: |
          git -C pr2 apply --whitespace=nowarn "$GITHUB_WORKSPACE/nxkit/pr2/display-options.patch"
          git -C pr2 apply --whitespace=nowarn "$GITHUB_WORKSPACE/nxkit/pr2/mem-anon.patch"
          git -C pr2 apply --whitespace=nowarn "$GITHUB_WORKSPACE/nxkit/pr2/tex-cap.patch"
          git -C pr2 apply --whitespace=nowarn "$GITHUB_WORKSPACE/nxkit/pr2/fps30.patch"

      - name: Download the input and delete its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          gh release download pr2-ipa-kit --pattern 'pr2-kit.nxk.*' --dir "$RUNNER_TEMP/in"
          gh release delete pr2-ipa-kit --yes --cleanup-tag

      - name: Decrypt the input
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          if [ -z "$KIT_PASSWORD" ]; then echo "::error::The KIT_PASSWORD secret is missing"; exit 1; fi
          cat $(ls "$RUNNER_TEMP"/in/pr2-kit.nxk.* | sort) > "$RUNNER_TEMP/kit.nxk"; rm -rf "$RUNNER_TEMP/in"
          python nxkit/nxkit.py decrypt "$RUNNER_TEMP/kit.nxk" "$RUNNER_TEMP/kit.tar"; rm "$RUNNER_TEMP/kit.nxk"
          mkdir -p "$RUNNER_TEMP/game"; tar -xf "$RUNNER_TEMP/kit.tar" -C "$RUNNER_TEMP/game"; rm "$RUNNER_TEMP/kit.tar"
          ls "$RUNNER_TEMP/game" "$RUNNER_TEMP/game/base/exefs"; du -sh "$RUNNER_TEMP/game"; df -h "$RUNNER_TEMP" | tail -1

      # The shader cache is kept on GitHub, encrypted, as the release pr2-shaders-<PR2_REF>: building the 11,561 shaders is 80 of a run's 85 minutes. Without it the run builds them and makes it
      - name: Restore the shader cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          T="pr2-shaders-${PR2_REF:0:12}"
          if gh release view "$T" > /dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/sc"; gh release download "$T" --pattern 'pr2-shaders.nxk.*' --dir "$RUNNER_TEMP/sc"
            cat $(ls "$RUNNER_TEMP"/sc/pr2-shaders.nxk.* | sort) > "$RUNNER_TEMP/sc.nxk"; rm -rf "$RUNNER_TEMP/sc"
            python nxkit/nxkit.py decrypt "$RUNNER_TEMP/sc.nxk" "$RUNNER_TEMP/sc.tar"; rm "$RUNNER_TEMP/sc.nxk"
            mkdir -p "$RUNNER_TEMP/game/0400C3F00006E000_build"; tar -xf "$RUNNER_TEMP/sc.tar" -C "$RUNNER_TEMP/game/0400C3F00006E000_build"; rm "$RUNNER_TEMP/sc.tar"
            echo "SHADER_CACHE=hit" >> "$GITHUB_ENV"; du -sh "$RUNNER_TEMP/game/0400C3F00006E000_build/shader"
          else echo "no shader cache yet (release $T): every shader is built, and the result is kept there"; fi

      - name: Build the IPA without the game files
        run: |
          cd pr2
          rc=0; python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" --platform ios --romfs separate --progress lines --env-file "$GITHUB_WORKSPACE/nxkit/pr2/env.txt" -o "$RUNNER_TEMP/slim.ipa" < /dev/null || rc=$?
          ls -l "$RUNNER_TEMP/slim.ipa" 2>/dev/null || true
          exit $rc

      - name: Encrypt the IPA, and keep a new shader cache on GitHub
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python nxkit/nxkit.py encrypt "$RUNNER_TEMP/slim.ipa" "$RUNNER_TEMP/out/slim.ipa.nxk"
          B="$RUNNER_TEMP/game/0400C3F00006E000_build"
          if [ -d "$B/shader" ] && [ "${SHADER_CACHE:-}" != hit ]; then
            tar -cf "$RUNNER_TEMP/shaders.tar" -C "$B" shader; mkdir -p "$RUNNER_TEMP/sc"; python nxkit/nxkit.py encrypt "$RUNNER_TEMP/shaders.tar" "$RUNNER_TEMP/sc/shaders.tar.nxk"; rm "$RUNNER_TEMP/shaders.tar"
            T="pr2-shaders-${PR2_REF:0:12}"; (cd "$RUNNER_TEMP/sc" && split -b 1900m -a 2 shaders.tar.nxk pr2-shaders.nxk. && rm shaders.tar.nxk && gh release create "$T" pr2-shaders.nxk.* --prerelease --title "$T" --notes "Encrypted shader cache of the pr2-ipa workflow.") || echo "::warning::the shader cache was not kept"
            rm -rf "$RUNNER_TEMP/sc"
          fi
          ls -lh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipa
          path: ${{ runner.temp }}/out/slim.ipa.nxk
          compression-level: 0
          retention-days: 1

      - name: Encrypt the build logs
        if: failure()
        env:
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
        run: |
          L="$RUNNER_TEMP/game/0400C3F00006E000_build/logs"
          if [ -d "$L" ]; then
            mkdir -p "$RUNNER_TEMP/out"
            tar -czf "$RUNNER_TEMP/logs.tgz" -C "$(dirname "$L")" logs
            python nxkit/nxkit.py encrypt "$RUNNER_TEMP/logs.tgz" "$RUNNER_TEMP/out/logs.tgz.nxk"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: ${{ runner.temp }}/out/logs.tgz.nxk
          if-no-files-found: ignore
          retention-days: 1
